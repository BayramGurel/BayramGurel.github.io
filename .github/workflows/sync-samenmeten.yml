name: Sync Samen Meten deployment

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/sync-samenmeten.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: samenmeten-pages-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          path: site
          ref: gh-pages

      - name: Checkout dashboard source
        uses: actions/checkout@v4
        with:
          repository: BayramGurel/Samenmeten-Dashboard-Vue
          ref: main
          path: source
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Validate source
        working-directory: source
        run: npm run lint

      - name: Build production site
        working-directory: source
        run: npm run build

      - name: Synchronize production build
        run: |
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='README.md'             --exclude='.nojekyll'             source/dist/ site/
          touch site/.nojekyll

      - name: Commit deployment when changed
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Deployment is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy latest Samen Meten build"
          git push origin gh-pages
